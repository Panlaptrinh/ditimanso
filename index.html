<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truy tìm kho báu ca dao Việt Nam</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React, ReactDOM, and Babel for standalone execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: #020617;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        .rotate-y-180 { transform: rotateY(180deg); }
        .rotate-y-0 { transform: rotateY(0deg); }
        .clip-path-pointer { clip-path: polygon(50% 100%, 0 0, 100% 0); }
        .shadow-neon { box-shadow: 0 0 20px rgba(79, 70, 229, 0.6); }
        .shadow-light { box-shadow: 0 0 15px rgba(255, 255, 255, 0.3); }
        .drop-shadow-glow { filter: drop-shadow(0 0 10px rgba(234,179,8,0.5)); }
        .text-pulse { animation: pulse-text 2s infinite; }
        @keyframes pulse-text { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        .shake { animation: shake-anim 0.5s; }
        @keyframes shake-anim { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        
        @keyframes stars { from { background-position: 0 0; } to { background-position: -10000px 5000px; } }
        .stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        }
        .stars {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; display: block;
            background: #000 url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat top center;
            opacity: 0.3;
        }
        .twinkling {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; display: block;
            background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/twinkling.png') repeat top center;
            animation: stars 200s linear infinite; opacity: 0.3;
        }

        .puzzle-input {
            font-size: 18px !important;
            caret-color: #fbbf24;
        }
        @media (min-width: 768px) {
            .puzzle-input {
                font-size: 24px !important;
            }
        }

        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #f15a24;
            border-radius: 10px;
        }

        .btn-3d-shadow {
            box-shadow: 0 6px 0 #c63017;
        }
        .btn-3d-shadow:active {
            box-shadow: 0 2px 0 #c63017;
            transform: translateY(4px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const LEVEL_THRESHOLDS = [0, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500];

        const WHEEL_SEGMENTS = [
            { label: "100", color: "#1e1b4b", value: 100 },
            { label: "300", color: "#312e81", value: 300 },
            { label: "500", color: "#3730a3", value: 500 },
            { label: "PHÁ SẢN", color: "#7f1d1d", value: -1 },
            { label: "+1 LƯỢT", color: "#064e3b", value: -3 },
            { label: "800", color: "#4338ca", value: 800 },
            { label: "MAY MẮN", color: "#92400e", value: 2000 },
            { label: "200", color: "#1e1b4b", value: 200 },
            { label: "400", color: "#312e81", value: 400 },
            { label: "MẤT LƯỢT", color: "#9a3412", value: -2 }
        ];

        const VIET_ALPHABET = "AĂÂBCDĐEÊGHIKLMNOÔƠPQRSTUƯVXY".split("");

        const GAME_DATA = [
            { q: "Cần lao vi bản, bất năng vi sư", a: "CẦN CÙ", desc: "Chăm chỉ là gốc rễ của sự thành công." },
            { q: "Dục tốc bất đạt", a: "VỘI VÀNG", desc: "Làm việc gì cũng cần kiên nhẫn, không nên quá nóng vội." },
            { q: "Bán tự vi sư, nhất tự vi sư", a: "DẠY DỖ", desc: "Tôn sư trọng đạo, một chữ cũng là thầy." },
            { q: "Tiên học lễ, hậu học văn", a: "LỄ NGHĨA", desc: "Học làm người trước khi học kiến thức." },
            { q: "Uống nước nhớ nguồn", a: "BIẾT ƠN", desc: "Lòng biết ơn đối với những người đi trước." },
            { q: "Gần bùn mà chẳng hôi tanh mùi bùn", a: "SEN", desc: "Giữ vững phẩm giá trong môi trường xấu." },
            { q: "Trúc xinh trúc mọc đầu đình", a: "TRÚC", desc: "Hình tượng cây trúc quân tử trong văn hóa." },
            { q: "Một con ngựa đau cả tàu bỏ cỏ", a: "ĐOÀN KẾT", desc: "Sự thấu cảm và tinh thần tập thể." },
            { q: "Thương người như thể thương thân", a: "NHÂN ÁI", desc: "Lòng nhân từ giữa người với người." },
            { q: "Có công mài sắt có ngày nên kim", a: "KIÊN TRÌ", desc: "Sự kiên trì sẽ dẫn đến thành quả vĩ đại." }
        ];

        function App() {
            const [showIntro, setShowIntro] = useState(true);
            const [currentLevel, setCurrentLevel] = useState(0);
            const [score, setScore] = useState(0);
            const [spinsLeft, setSpinsLeft] = useState(3);
            const [revealedLetters, setRevealedLetters] = useState(new Set());
            const [userGuessMap, setUserGuessMap] = useState({});
            const [statusMsg, setStatusMsg] = useState("Quay nón để mở gợi ý!");
            const [currentWheelValue, setCurrentWheelValue] = useState(0);
            const [canGuess, setCanGuess] = useState(false);
            const [rotation, setRotation] = useState(0);
            const [isSpinning, setIsSpinning] = useState(false);
            const [showRecharge, setShowRecharge] = useState(false);
            const [mathTask, setMathTask] = useState({ q: "", a: 0 });
            const [showSuccessModal, setShowSuccessModal] = useState(false);
            const [showFailThresholdModal, setShowFailThresholdModal] = useState(false);
            const [gameOver, setGameOver] = useState(false);
            const [wheelResultLabel, setWheelResultLabel] = useState("");

            const wheelCanvasRef = useRef(null);

            const stripToneOnly = (str) => {
                if (!str) return "";
                return str.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").normalize("NFC");
            };

            const drawWheel = useCallback((canvas, size) => {
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const center = size / 2;
                const radius = center - 8;
                const slice = (Math.PI * 2) / WHEEL_SEGMENTS.length;

                ctx.clearRect(0, 0, size, size);
                WHEEL_SEGMENTS.forEach((seg, i) => {
                    const angle = i * slice;
                    ctx.beginPath();
                    ctx.fillStyle = seg.color;
                    ctx.moveTo(center, center);
                    ctx.arc(center, center, radius, angle, angle + slice);
                    ctx.fill();
                    ctx.strokeStyle = "rgba(255,255,255,0.2)";
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(center, center);
                    ctx.rotate(angle + slice / 2);
                    ctx.textAlign = "right";
                    ctx.fillStyle = "white";
                    ctx.font = `bold ${size * 0.05}px Arial`;
                    ctx.fillText(seg.label, radius - 10, 5);
                    ctx.restore();
                });

                ctx.beginPath();
                ctx.arc(center, center, radius, 0, Math.PI * 2);
                ctx.strokeStyle = "#fbbf24";
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(center, center, 10, 0, Math.PI * 2);
                ctx.fillStyle = "#fff";
                ctx.fill();
            }, []);

            useEffect(() => {
                if (!showIntro && wheelCanvasRef.current) {
                    drawWheel(wheelCanvasRef.current, 250);
                }
            }, [drawWheel, showIntro]);

            useEffect(() => {
                setUserGuessMap({});
                setRevealedLetters(new Set());
                setCanGuess(false);
                setWheelResultLabel("");
            }, [currentLevel]);

            const spinWheel = () => {
                if (isSpinning || canGuess) return;
                if (spinsLeft <= 0) {
                    const a = Math.floor(Math.random() * 15) + 5;
                    const b = Math.floor(Math.random() * 10) + 2;
                    const c = Math.floor(Math.random() * 20) + 5;
                    setMathTask({ q: `(${a} x ${b}) - ${c} = ?`, a: (a * b) - c });
                    setShowRecharge(true);
                    return;
                }

                setSpinsLeft(prev => prev - 1);
                setIsSpinning(true);
                setWheelResultLabel("");
                const extraRotation = 1440 + Math.random() * 360; 
                const newRotation = rotation + extraRotation;
                setRotation(newRotation);

                setTimeout(() => {
                    setIsSpinning(false);
                    const actualDeg = newRotation % 360;
                    const sliceSize = 360 / WHEEL_SEGMENTS.length;
                    const index = Math.floor(((360 - (actualDeg % 360) + 270) % 360) / sliceSize);
                    const result = WHEEL_SEGMENTS[index];
                    setWheelResultLabel(result.label);
                    handleWheelResult(result);
                }, 4000);
            };

            const handleWheelResult = (result) => {
                if (result.value === -1) {
                    setScore(500);
                    setStatusMsg("Xém Phá SẢN! An ủi 500 nghen.");
                } else if (result.value === -2) {
                    setStatusMsg("MẤT LƯỢT!");
                } else if (result.value === -3) {
                    setSpinsLeft(prev => prev + 1);
                    setStatusMsg("+1 LƯỢT QUAY!");
                } else {
                    setCurrentWheelValue(result.value);
                    setStatusMsg(`${result.label} ĐIỂM! Hãy đoán ký tự câu hỏi.`);
                    setCanGuess(true);
                }
            };

            const handleLetterGuess = (char) => {
                if (!canGuess) return;
                const data = GAME_DATA[currentLevel];
                const targetChar = char.toUpperCase();
                const questionStr = stripToneOnly(data.q);
                let count = 0;
                for (let i = 0; i < questionStr.length; i++) {
                    if (questionStr[i] === targetChar) count++;
                }

                if (count > 0) {
                    const bonus = count * currentWheelValue;
                    setScore(prev => prev + bonus);
                    const newRevealed = new Set(revealedLetters);
                    newRevealed.add(targetChar);
                    setRevealedLetters(newRevealed);
                    setStatusMsg(`Chính xác! Có ${count} ký tự ${char}.`);
                } else {
                    setScore(prev => Math.max(0, prev - 200));
                    setStatusMsg(`Tiếc quá! Không có ký tự ${char}.`);
                }
                setCanGuess(false);
                setWheelResultLabel("");
            };

            const handleInputChange = (wordIdx, cIdx, val) => {
                const key = `${wordIdx}-${cIdx}`;
                const upperVal = stripToneOnly(val.slice(-1)); 
                setUserGuessMap(prev => ({ ...prev, [key]: upperVal }));

                if (upperVal && cIdx < GAME_DATA[currentLevel].a.split(' ')[wordIdx].length - 1) {
                    const nextInput = document.getElementById(`input-${wordIdx}-${cIdx + 1}`);
                    if (nextInput) nextInput.focus();
                } else if (upperVal && wordIdx < GAME_DATA[currentLevel].a.split(' ').length - 1) {
                    const nextWordFirstInput = document.getElementById(`input-${wordIdx + 1}-0`);
                    if (nextWordFirstInput) nextWordFirstInput.focus();
                }
            };

            const handleKeyDown = (wordIdx, cIdx, e) => {
                const key = `${wordIdx}-${cIdx}`;
                if (e.key === 'Backspace' && !userGuessMap[key]) {
                    if (cIdx > 0) {
                        const prevInput = document.getElementById(`input-${wordIdx}-${cIdx - 1}`);
                        if (prevInput) prevInput.focus();
                    } else if (wordIdx > 0) {
                        const prevWord = GAME_DATA[currentLevel].a.split(' ')[wordIdx - 1];
                        const lastCharIdxOfPrevWord = prevWord.length - 1;
                        const prevInput = document.getElementById(`input-${wordIdx - 1}-${lastCharIdxOfPrevWord}`);
                        if (prevInput) prevInput.focus();
                    }
                }
            };

            const checkFinalAnswer = () => {
                const data = GAME_DATA[currentLevel];
                const words = data.a.split(' ');
                let isAllCorrect = true;

                for (let w = 0; w < words.length; w++) {
                    const chars = words[w].split('');
                    for (let c = 0; c < chars.length; c++) {
                        const userInput = userGuessMap[`${w}-${c}`] || "";
                        if (userInput !== stripToneOnly(chars[c])) {
                            isAllCorrect = false;
                            break;
                        }
                    }
                    if (!isAllCorrect) break;
                }

                if (isAllCorrect) {
                    setScore(prev => prev + 10000);
                    setStatusMsg("CHÍNH XÁC! Kho báu đã mở.");
                    setTimeout(() => setShowSuccessModal(true), 800);
                } else {
                    setScore(prev => Math.max(0, prev - 1000));
                    setStatusMsg("Mật mã chưa khớp!");
                    const container = document.getElementById('answer-area');
                    if (container) {
                        container.classList.add('shake');
                        setTimeout(() => container.classList.remove('shake'), 500);
                    }
                }
            };

            const handleNextLevel = () => {
                const nextIdx = currentLevel + 1;
                if (nextIdx >= GAME_DATA.length) { setGameOver(true); return; }
                if (score < LEVEL_THRESHOLDS[nextIdx]) setShowFailThresholdModal(true);
                else { setShowSuccessModal(false); setCurrentLevel(nextIdx); }
            };

            return (
                <div className="relative w-full h-screen flex flex-col z-10 overflow-hidden bg-[#020617]">
                    <div className="stars-container">
                        <div className="stars"></div>
                        <div className="twinkling"></div>
                    </div>

                    {/* MODAL HƯỚNG DẪN */}
                    {showIntro && (
                        <div className="fixed inset-0 z-[500] flex items-center justify-center bg-black/60 backdrop-blur-md p-2 overflow-y-auto">
                            <div className="relative w-full max-w-[460px] bg-white rounded-[45px] border-[8px] md:border-[10px] border-[#ffcc33] flex flex-col items-center p-5 md:p-8 shadow-2xl animate-in zoom-in duration-300 my-auto">
                                <div className="absolute top-4 left-6 opacity-10 text-7xl grayscale select-none">🗺️</div>
                                <div className="text-center mb-4 md:mb-6 relative z-10">
                                    <h1 className="text-[#f15a24] text-3xl md:text-4xl font-black uppercase tracking-tight mb-1">Hướng Dẫn Giải Mã</h1>
                                    <div className="bg-[#ffe8ed] px-5 py-1 rounded-full inline-block">
                                        <span className="text-[#ff4d6d] font-bold text-xs md:text-sm uppercase tracking-widest italic">Độ khó: Bậc thầy</span>
                                    </div>
                                </div>
                                <div className="w-full bg-[#f8f9fa] rounded-[25px] border border-gray-100 p-4 md:p-6 mb-6 custom-scroll overflow-y-auto max-h-[50vh] relative z-10 shadow-inner">
                                    <h2 className="text-[#5d4037] text-base md:text-lg font-bold text-center mb-5 flex items-center justify-center gap-2">📜 Quy Tắc Kho Báu:</h2>
                                    <ul className="space-y-4 md:space-y-5">
                                        <li className="flex items-start gap-3">
                                            <span className="text-2xl flex-shrink-0">🎡</span>
                                            <div>
                                                <p className="text-xs md:text-sm font-black text-[#5e35b1]">Vòng Quay May Mắn:</p>
                                                <p className="text-[10px] md:text-[11px] text-gray-500 font-medium leading-tight">Quay nón để định giá chữ cái. Tránh ô PHÁ SẢN làm mất sạch điểm quỹ.</p>
                                            </div>
                                        </li>
                                        <li className="flex items-start gap-3 border-t border-gray-100 pt-3">
                                            <span className="text-2xl flex-shrink-0">💡</span>
                                            <div>
                                                <p className="text-xs md:text-sm font-black text-[#1e88e5]">Gợi Ý Cổ Thư:</p>
                                                <p className="text-[10px] md:text-[11px] text-gray-500 font-medium leading-tight">Đoán chữ để mở câu hỏi gợi ý. Mọi dấu thanh đều bị ẩn giấu.</p>
                                            </div>
                                        </li>
                                        <li className="flex items-start gap-3 border-t border-gray-100 pt-3">
                                            <span className="text-2xl flex-shrink-0">⌨️</span>
                                            <div>
                                                <p className="text-xs md:text-sm font-black text-[#757575]">Tự Giải Mật Mã:</p>
                                                <p className="text-[10px] md:text-[11px] text-gray-500 font-medium leading-tight">Nhập đáp án không dấu vào các ô trống bên dưới để giải mã hoàn toàn.</p>
                                            </div>
                                        </li>
                                        <li className="flex items-start gap-3 border-t border-gray-100 pt-3">
                                            <span className="text-2xl flex-shrink-0">🏺</span>
                                            <div>
                                                <p className="text-xs md:text-sm font-black text-[#fbc02d]">Mốc Điểm Vượt Cấp:</p>
                                                <p className="text-[10px] md:text-[11px] text-gray-500 font-medium leading-tight">Mỗi chương yêu cầu số điểm Quota tối thiểu để mở phong ấn bước tiếp.</p>
                                            </div>
                                        </li>
                                            <li className="flex items-start gap-3 border-t border-gray-100 pt-3">
                                            <span className="text-2xl flex-shrink-0">🐼</span>
                                            <div>
                                                <p className="text-xs md:text-sm font-black text-[#fbc02d]">Nhà Phát Hành Game:</p>
                                                <p className="text-[10px] md:text-[11px] text-gray-500 font-medium leading-tight">Mình là PN-293 là người phát hành game . Chúc mọi người chơi game vui vẻ.</p>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                                <button onClick={() => setShowIntro(false)} className="relative w-full max-w-[320px] btn-3d-shadow mb-2">
                                    <div className="bg-gradient-to-r from-[#f15a24] to-[#ff8c3a] text-white font-black text-lg py-4 rounded-2xl border-2 border-white shadow-lg flex items-center justify-center gap-3">CHẤP NHẬN THỬ THÁCH 🚀</div>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* HEADER */}
                    <div className="relative z-20 flex justify-between items-center px-4 md:px-6 py-4 bg-black/70 border-b border-white/10 backdrop-blur-md flex-shrink-0">
                        <div className="flex flex-col">
                            <p className="text-[10px] text-indigo-400 font-bold uppercase tracking-tight">Tiền quỹ</p>
                            <p className="text-2xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-amber-600 drop-shadow-glow">
                                {score.toLocaleString()}đ
                            </p>
                            <div className="mt-1 text-[8px] md:text-[9px] bg-blue-900/40 px-2 py-0.5 rounded border border-blue-500/30 w-fit">
                                Mục tiêu LV{currentLevel + 2}: <span className="text-blue-300 font-bold">{(LEVEL_THRESHOLDS[currentLevel+1] || 0).toLocaleString()}đ</span>
                            </div>
                        </div>

                        <div className="flex flex-col items-center">
                            <p className="text-[9px] text-slate-400 font-bold uppercase mb-1">⚡ Quota</p>
                            <div className="flex items-center gap-2">
                                <span className={`text-2xl md:text-3xl font-black ${spinsLeft <= 1 ? 'text-red-500 animate-pulse' : 'text-white'}`}>{spinsLeft}</span>
                                <button 
                                    onClick={() => { if(score >= 800) { setScore(s => s - 800); setSpinsLeft(l => l + 1); } }}
                                    className="bg-emerald-600 hover:bg-emerald-500 text-white text-[8px] md:text-[10px] font-bold px-3 py-1.5 rounded-lg border-b-4 border-emerald-900 active:scale-95 shadow-lg whitespace-nowrap"
                                >
                                    +1⚡
                                </button>
                            </div>
                        </div>

                        <div className="text-right flex flex-col items-end">
                            <p className="text-[9px] text-blue-400 font-bold uppercase truncate max-w-[100px] md:max-w-[200px]">{statusMsg}</p>
                            <p className="text-xl md:text-2xl font-black text-green-500 italic uppercase">Chương {currentLevel + 1}</p>
                        </div>
                    </div>

                    {/* MAIN GAME AREA */}
                    <div className="relative z-20 flex-1 flex flex-col justify-center items-center p-4 gap-8 overflow-y-auto custom-scroll">
                        {/* Di sản cổ thư */}
                        <div className="w-full text-center py-2">
                            <h3 className="text-[10px] md:text-[11px] text-indigo-400/60 font-black tracking-[0.4em] uppercase mb-4">DI SẢN CỔ THƯ</h3>
                            <div className="flex flex-wrap justify-center gap-1.5 md:gap-2">
                                {GAME_DATA[currentLevel].q.split(' ').map((word, wIdx) => (
                                    <div key={wIdx} className="flex gap-1 mb-2 flex-shrink-0">
                                        {word.split('').map((char, cIdx) => {
                                            const baseChar = stripToneOnly(char);
                                            const isReveal = revealedLetters.has(baseChar) || !VIET_ALPHABET.includes(baseChar);
                                            return (
                                                <div key={cIdx} className={`w-7 h-9 md:w-10 md:h-12 flex-shrink-0 flex items-center justify-center font-bold text-base md:text-xl rounded-md border transition-all duration-500 ${isReveal ? 'bg-white text-indigo-900 border-indigo-200 rotate-y-0 shadow-light' : 'bg-slate-800/60 border-slate-700 text-transparent rotate-y-180'}`}>
                                                    {isReveal ? baseChar : ''}
                                                </div>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Mật mã truy tìm */}
                        <div className="w-full text-center py-4" id="answer-area">
                            <h3 className="text-[10px] md:text-[11px] text-yellow-500/60 font-black tracking-[0.4em] uppercase mb-4 text-pulse">MẬT MÃ TRUY TÌM (TỰ ĐIỀN)</h3>
                            <div className="flex flex-wrap justify-center gap-3 md:gap-4 mb-6">
                                {GAME_DATA[currentLevel].a.split(' ').map((word, wIdx) => (
                                    <div key={wIdx} className="flex gap-1.5 md:gap-2 flex-shrink-0">
                                        {word.split('').map((char, cIdx) => {
                                            const val = userGuessMap[`${wIdx}-${cIdx}`] || "";
                                            return (
                                                <input
                                                    key={cIdx}
                                                    id={`input-${wIdx}-${cIdx}`}
                                                    type="text"
                                                    maxLength="1"
                                                    value={val}
                                                    inputMode="text"
                                                    autoComplete="off"
                                                    autoCorrect="off"
                                                    autoCapitalize="characters"
                                                    spellCheck="false"
                                                    enterKeyHint="next"
                                                    onFocus={(e) => e.target.select()}
                                                    onKeyDown={(e) => handleKeyDown(wIdx, cIdx, e)}
                                                    onChange={(e) => handleInputChange(wIdx, cIdx, e.target.value)}
                                                    className={`puzzle-input w-8 h-11 md:w-12 md:h-16 flex-shrink-0 bg-black/40 border-b-4 border-slate-700 flex items-center justify-center font-black text-center uppercase focus:outline-none focus:border-yellow-500 transition-all ${val ? 'text-white border-indigo-500 shadow-neon' : 'text-slate-500'}`}
                                                />
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                            <button 
                                onClick={checkFinalAnswer}
                                className="bg-gradient-to-r from-yellow-500 to-amber-600 text-black px-10 py-3 rounded-full font-black uppercase text-xs md:text-sm tracking-widest shadow-xl hover:scale-105 active:scale-95 transition-all"
                            >
                                GIẢI MÃ KHO BÁU
                            </button>
                        </div>
                    </div>

                    {/* CONTROLS AREA */}
                    <div className="relative z-20 bg-black/80 backdrop-blur-xl p-4 md:p-6 border-t border-white/10 flex flex-col md:flex-row items-center gap-4 md:gap-6 flex-shrink-0">
                        <div className="flex items-center gap-6">
                            <div className="relative group cursor-pointer" onClick={spinWheel}>
                                <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-5 h-7 bg-red-600 z-30 clip-path-pointer drop-shadow-md border border-red-400"></div>
                                <div className="relative w-32 h-32 md:w-40 md:h-40 bg-slate-900 rounded-full flex items-center justify-center border-4 md:border-8 border-white/5 overflow-hidden shadow-2xl">
                                    <canvas ref={wheelCanvasRef} width="250" height="250" className={`w-full h-full transition-transform duration-[4000ms] ease-[cubic-bezier(0.1,0,0.1,1)] ${isSpinning ? 'blur-[2px]' : ''}`} style={{ transform: `rotate(${rotation}deg)` }}></canvas>
                                    {wheelResultLabel && !isSpinning && (
                                        <div className="absolute inset-0 flex items-center justify-center z-40">
                                            <div className="bg-white text-black px-3 py-1.5 rounded-lg font-black text-base md:text-xl shadow-white animate-bounce">{wheelResultLabel}</div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 w-full space-y-2">
                            <p className="text-[9px] md:text-[10px] text-slate-500 font-bold uppercase tracking-widest text-center md:text-left">
                                {canGuess ? "Chọn một ký tự câu hỏi" : "Hãy quay nón nạp năng lượng"}
                            </p>
                            <div className="grid grid-cols-10 gap-1 md:gap-1.5">
                                {VIET_ALPHABET.map(char => {
                                    const isSelected = revealedLetters.has(char);
                                    return (
                                        <button key={char} onClick={() => handleLetterGuess(char)} disabled={!canGuess || isSelected} className={`aspect-square flex items-center justify-center font-bold text-[10px] md:text-sm rounded-md border-b-2 md:border-b-4 transition-all ${(!canGuess || isSelected) ? 'bg-slate-900/50 text-slate-700 border-slate-950 opacity-40' : 'bg-slate-800 text-white border-black hover:bg-indigo-800 active:scale-90 active:border-b-0'}`}>{char}</button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* MODALS PHỤ (Recharge, Success, Fail, Victory) */}
                    {showRecharge && (
                        <div className="fixed inset-0 z-[600] bg-black/90 flex items-center justify-center p-6 backdrop-blur-md">
                            <div className="bg-[#0f172a] p-8 md:p-10 rounded-[2rem] border-2 border-red-500 max-w-sm w-full text-center shadow-2xl">
                                <div className="text-red-500 text-6xl mb-4 animate-pulse">⚡</div>
                                <h2 className="text-xl md:text-2xl font-black mb-2 uppercase text-white">Nạp Năng Lượng</h2>
                                <div className="bg-black/60 p-6 md:p-8 rounded-3xl mb-6 text-center">
                                    <p className="text-xl md:text-2xl font-black mb-4 text-blue-400">{mathTask.q}</p>
                                    <input type="number" autoFocus onKeyDown={(e) => { if (e.key === 'Enter') { if (parseInt(e.target.value) === mathTask.a) { setSpinsLeft(3); setShowRecharge(false); } else { e.target.value = ""; } } }} className="w-full bg-slate-900 text-white p-3 rounded-xl text-center text-2xl font-black border-2 border-red-600/30" placeholder="?" />
                                </div>
                            </div>
                        </div>
                    )}

                    {showSuccessModal && (
                        <div className="fixed inset-0 z-[600] bg-black/95 flex items-center justify-center p-6 backdrop-blur-lg text-center">
                            <div className="bg-[#0f172a] p-8 md:p-10 rounded-[3rem] border-4 border-emerald-500/30 max-w-sm w-full shadow-2xl">
                                <div className="text-6xl md:text-7xl mb-6">🏆</div>
                                <h2 className="text-2xl md:text-3xl font-black mb-2 text-white uppercase font-serif tracking-tighter">THÀNH CÔNG</h2>
                                <p className="text-slate-400 mb-6 text-xs md:text-sm italic font-serif">"{GAME_DATA[currentLevel].desc}"</p>
                                <div className="bg-black/40 p-4 md:p-5 rounded-2xl mb-8 border border-emerald-500/20">
                                    <p className="text-3xl md:text-4xl font-black text-emerald-400">{score.toLocaleString()}đ</p>
                                </div>
                                <button onClick={handleNextLevel} className="w-full bg-emerald-600 hover:bg-emerald-500 py-3 md:py-4 rounded-xl font-black text-lg shadow-lg active:scale-95">TIẾP THEO</button>
                            </div>
                        </div>
                    )}

                    {showFailThresholdModal && (
                        <div className="fixed inset-0 z-[600] bg-black/95 flex items-center justify-center p-6 text-center">
                            <div className="bg-slate-900 p-10 rounded-3xl border-4 border-red-600 max-w-sm w-full shadow-2xl">
                                <div className="text-6xl md:text-7xl mb-6">🚫</div>
                                <h2 className="text-xl md:text-2xl font-black mb-4 uppercase text-white tracking-tighter">Chưa Đủ Điểm</h2>
                                <p className="text-slate-400 text-xs md:text-sm mb-8 leading-relaxed italic">Bạn cần tối thiểu <span className="text-red-500 font-bold">{LEVEL_THRESHOLDS[currentLevel + 1].toLocaleString()}đ</span> để mở phong ấn. Hiện có: <span className="font-bold text-white">{score.toLocaleString()}đ</span>.</p>
                                <button onClick={() => location.reload()} className="w-full bg-red-600 py-3 md:py-4 rounded-xl font-black text-white active:scale-95 shadow-lg">BẮT ĐẦU LẠI</button>
                            </div>
                        </div>
                    )}

                    {gameOver && (
                        <div className="fixed inset-0 z-[700] bg-[#020617] flex flex-col items-center justify-center p-8 text-center">
                            <div className="text-8xl md:text-9xl mb-8 animate-pulse drop-shadow-glow">👑</div>
                            <h1 className="text-4xl md:text-6xl font-black text-yellow-500 mb-4 uppercase italic tracking-tighter">ĐẠI SƯ VĨNH HẰNG</h1>
                            <p className="text-slate-300 mb-12 text-lg md:text-xl font-serif">Tổng di sản tích lũy: <span className="text-emerald-400 font-bold">{score.toLocaleString()}đ</span></p>
                            <button onClick={() => location.reload()} className="bg-white text-black px-12 md:px-16 py-4 md:py-5 rounded-full font-black text-xl md:text-2xl shadow-xl hover:scale-105 active:scale-95 transition-all">TÁI SINH</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
